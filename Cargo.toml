[package]
name = "voice-chat-bot"
version = "0.1.0"
edition = "2021"
authors = ["Voice Chat Bot Contributors"]
description = "High-performance voice chat bot with zero hallucination guarantee"
license = "MIT"

[dependencies]
# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Command line interface
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
